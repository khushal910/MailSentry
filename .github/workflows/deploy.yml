# =========================================================================
# MailSentry Production Deployment (CD) Workflow
# Sequential ML Service → Backend API Deployment Pipeline
# Gated on successful completion of MailSentry Continuous Integration (CI)
# =========================================================================

name: MailSentry Production CD & Post-Deploy Verification

on:
  workflow_run:
    workflows: ["MailSentry Continuous Integration (CI)"]
    branches: ["main"]
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: deployment-production
  cancel-in-progress: false

jobs:
  # =========================================================================
  # JOB 1: PRE-DEPLOYMENT VALIDATION GATE
  # =========================================================================
  pre-deploy-gate:
    name: Validate CI Pipeline Success Gate
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Validate Pipeline Gate
        run: |
          echo "CI pipeline completed successfully on main. Proceeding to sequential production deployment."

  # =========================================================================
  # JOB 2: AUTOMATED ML MICROSERVICE DEPLOYMENT & READINESS PROBE
  # =========================================================================
  deploy-ml-service:
    name: Deploy ML Microservice (Render) & Wait for Ready
    needs: [pre-deploy-gate]
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render ML Microservice Deployment Hook
        env:
          RENDER_ML_HOOK: ${{ secrets.RENDER_ML_SERVICE_DEPLOY_HOOK_URL || secrets.RENDER_ML_SERVICE_HOOK }}
        run: |
          echo "========================================"
          echo "Deploying ML Microservice"
          echo "========================================"
          if [ -z "$RENDER_ML_HOOK" ]; then
            echo "WARNING: RENDER_ML_SERVICE_DEPLOY_HOOK_URL secret is not set in GitHub repository secrets."
            echo "Assuming external/auto deployment trigger."
          else
            echo "Triggering Render ML Microservice deployment hook..."
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$RENDER_ML_HOOK")
            HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
            echo "Render ML Service Deploy Hook HTTP Status: $HTTP_STATUS"
            if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 201 ] && [ "$HTTP_STATUS" -ne 202 ]; then
              echo "Error triggering Render ML Service deploy hook!"
              exit 1
            fi
            echo "Render ML Service deployment trigger submitted successfully."
          fi

      - name: Wait for ML Service Readiness
        env:
          ML_SERVICE_URL: ${{ secrets.PRODUCTION_ML_SERVICE_URL }}
        run: |
          TARGET_URL="${ML_SERVICE_URL:-https://mailsentry-ml-service.onrender.com}"
          READY_URL="${TARGET_URL}/ready"
          HEALTH_URL="${TARGET_URL}/health"
          echo "Waiting for ML Service readiness probe at: ${READY_URL}"
          
          MAX_ATTEMPTS=30
          ATTEMPT=1
          SUCCESS=0

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            # Try /ready endpoint first, fallback to /health if /ready returns 404
            STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${READY_URL}" || echo "000")
            if [ "$STATUS_CODE" -eq 404 ]; then
              STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${HEALTH_URL}" || echo "000")
            fi

            if [ "$STATUS_CODE" -eq 200 ]; then
              echo "[${ATTEMPT}/${MAX_ATTEMPTS}] ML Service READY (HTTP 200)"
              SUCCESS=1
              break
            else
              echo "[${ATTEMPT}/${MAX_ATTEMPTS}] ML Service not ready (HTTP ${STATUS_CODE}). Retrying in 10s..."
            fi

            ATTEMPT=$((ATTEMPT + 1))
            sleep 10
          done

          if [ $SUCCESS -eq 1 ]; then
            echo "========================================"
            echo "ML Service deployment successful and healthy."
            echo "Proceeding to backend deployment."
            echo "========================================"
          else
            echo "========================================"
            echo "ERROR: ML Service failed to become ready within 5 minutes."
            echo "Stopping deployment. Backend deployment will NOT run."
            echo "========================================"
            exit 1
          fi

  # =========================================================================
  # JOB 3: AUTOMATED BACKEND DEPLOYMENT TO RENDER (Gated on ML Ready)
  # =========================================================================
  deploy-backend:
    name: Deploy Backend Service (Render) & Verify Health
    needs: [deploy-ml-service]
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Backend Deployment Hook
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "========================================"
          echo "Deploying Backend API Service"
          echo "========================================"
          if [ -z "$RENDER_HOOK" ]; then
            echo "WARNING: RENDER_DEPLOY_HOOK_URL secret is not set in GitHub repository secrets."
            echo "Assuming external/auto deployment trigger."
          else
            echo "Triggering Render backend deployment hook..."
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$RENDER_HOOK")
            HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
            echo "Render Backend Deploy Hook HTTP Status: $HTTP_STATUS"
            if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 201 ] && [ "$HTTP_STATUS" -ne 202 ]; then
              echo "Error triggering Render backend deploy hook!"
              exit 1
            fi
            echo "Render backend deployment trigger submitted successfully."
          fi

      - name: Wait for Backend Health Verification
        env:
          BACKEND_URL: ${{ secrets.PRODUCTION_BACKEND_URL }}
        run: |
          TARGET_URL="${BACKEND_URL:-https://mailsentry-backend.onrender.com}"
          HEALTH_URL="${TARGET_URL}/health"
          echo "Waiting for Backend health probe at: ${HEALTH_URL}"
          
          MAX_ATTEMPTS=30
          ATTEMPT=1
          SUCCESS=0

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${HEALTH_URL}" || echo "000")
            if [ "$STATUS_CODE" -eq 200 ]; then
              echo "[${ATTEMPT}/${MAX_ATTEMPTS}] Backend Service READY (HTTP 200)"
              SUCCESS=1
              break
            else
              echo "[${ATTEMPT}/${MAX_ATTEMPTS}] Backend Service not ready (HTTP ${STATUS_CODE}). Retrying in 10s..."
            fi

            ATTEMPT=$((ATTEMPT + 1))
            sleep 10
          done

          if [ $SUCCESS -eq 1 ]; then
            echo "========================================"
            echo "Backend deployment successful and healthy."
            echo "========================================"
          else
            echo "========================================"
            echo "ERROR: Backend Service failed to become healthy within 5 minutes."
            echo "========================================"
            exit 1
          fi

  # =========================================================================
  # JOB 4: POST-DEPLOYMENT STATUS SUMMARY REPORT
  # =========================================================================
  post-deploy-summary:
    name: Generate Deployment Status Report
    needs: [deploy-ml-service, deploy-backend]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Generate Deployment Step Summary
        run: |
          ML_STATUS="${{ needs.deploy-ml-service.result }}"
          BACKEND_STATUS="${{ needs.deploy-backend.result }}"

          echo "## 🚀 MailSentry Production Deployment Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service Component | Status | Deployment Trigger | Readiness Probe |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- | --- | --- |" >> $GITHUB_STEP_SUMMARY

          if [ "$ML_STATUS" = "success" ]; then
            echo "| **ML Microservice** | ✅ Success | Render Hook | `/ready` = 200 OK |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| **ML Microservice** | ❌ Failed | Render Hook | Readiness Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$BACKEND_STATUS" = "success" ]; then
            echo "| **Backend API** | ✅ Success | Render Hook | `/health` = 200 OK |" >> $GITHUB_STEP_SUMMARY
          elif [ "$ML_STATUS" != "success" ]; then
            echo "| **Backend API** | 🚫 Skipped | Blocked by ML Failure | Not Executed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| **Backend API** | ❌ Failed | Render Hook | Health Check Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "| **Frontend Web App** | ✅ Deployed | Vercel Git Integration | Vercel Cloud |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit SHA:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered By:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          
          if [ "$ML_STATUS" = "success" ] && [ "$BACKEND_STATUS" = "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "========================================" >> $GITHUB_STEP_SUMMARY
            echo "MailSentry deployment successful" >> $GITHUB_STEP_SUMMARY
            echo "========================================" >> $GITHUB_STEP_SUMMARY
          fi
