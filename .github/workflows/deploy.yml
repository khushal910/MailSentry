# =========================================================================
# MailSentry Production Deployment (CD) Workflow
# Sequential ML Service → Backend API Deployment Pipeline
# Gated on successful completion of MailSentry Continuous Integration (CI)
# =========================================================================

name: MailSentry Production CD & Post-Deploy Verification

on:
  workflow_run:
    workflows: ["MailSentry Continuous Integration (CI)"]
    branches: ["main"]
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: deployment-production
  cancel-in-progress: false

jobs:
  # =========================================================================
  # STEP 1: PRE-DEPLOYMENT VALIDATION GATE & TESTS VERIFICATION
  # =========================================================================
  pre-deploy-gate:
    name: "[1/5] Running tests & CI Gate"
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Validate Tests & CI Pipeline Gate
        run: |
          echo "[1/5] Running tests..."
          if [ "${{ github.event_name }}" = "workflow_run" ] && [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "ERROR: Deployment failed during [1/5] Running tests (CI pipeline failed)."
            exit 1
          fi
          echo "CI test suite verification passed. Proceeding to ML Service deployment."

  # =========================================================================
  # STEP 2 & 3: ML MICROSERVICE DEPLOYMENT & HEALTH CHECK PROBE
  # =========================================================================
  deploy-ml-service:
    name: "[2/5] & [3/5] Deploy ML Service & Wait for Health"
    needs: [pre-deploy-gate]
    runs-on: ubuntu-latest

    steps:
      - name: Deploy ML Service
        env:
          RENDER_ML_HOOK: ${{ secrets.RENDER_ML_SERVICE_DEPLOY_HOOK_URL || secrets.RENDER_ML_SERVICE_HOOK }}
        run: |
          echo "[2/5] Deploying ML Service..."
          if [ -z "$RENDER_ML_HOOK" ]; then
            echo "WARNING: RENDER_ML_SERVICE_DEPLOY_HOOK_URL secret is not set in GitHub repository secrets."
            echo "Assuming external/auto deployment trigger."
          else
            echo "Triggering Render ML Microservice deployment hook..."
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$RENDER_ML_HOOK")
            HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
            if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 201 ] && [ "$HTTP_STATUS" -ne 202 ]; then
              echo "ERROR: Deployment failed during [2/5] Deploying ML Service (Hook HTTP ${HTTP_STATUS})."
              exit 1
            fi
            echo "Render ML Service deployment hook triggered successfully."
          fi

      - name: Wait for ML Service Health
        env:
          ML_SERVICE_URL: ${{ secrets.PRODUCTION_ML_SERVICE_URL }}
        run: |
          echo "[3/5] Waiting for ML Service health..."
          TARGET_URL="${ML_SERVICE_URL:-https://mailsentry-ml-service.onrender.com}"
          HEALTH_URL="${TARGET_URL}/health"
          
          MAX_ATTEMPTS=40
          ATTEMPT=1
          SUCCESS=0

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            HTTP_STATUS=$(curl -s -o ml_health.json -w "%{http_code}" "${HEALTH_URL}" || echo "000")
            echo "ML Service status: ${HTTP_STATUS}"

            if [ "$HTTP_STATUS" -eq 200 ]; then
              MODEL_LOADED=$(python3 -c "import json; d=json.load(open('ml_health.json')); print(d.get('model_loaded', False))" 2>/dev/null || echo "True")
              if [ "$MODEL_LOADED" = "True" ] || [ "$MODEL_LOADED" = "true" ]; then
                echo "ML Service is healthy."
                SUCCESS=1
                break
              fi
            fi

            ATTEMPT=$((ATTEMPT + 1))
            sleep 5
          done

          if [ $SUCCESS -ne 1 ]; then
            echo "========================================"
            echo "ERROR: Deployment failed during [3/5] Waiting for ML Service health."
            echo "ML Service never became healthy. Stopping deployment."
            echo "Backend deployment will NOT run."
            echo "========================================"
            exit 1
          fi

  # =========================================================================
  # STEP 4 & 5: BACKEND API DEPLOYMENT & HEALTH CHECK PROBE (Gated on ML)
  # =========================================================================
  deploy-backend:
    name: "[4/5] & [5/5] Deploy Backend & Wait for Health"
    needs: [deploy-ml-service]
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Backend
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "[4/5] Deploying Backend..."
          if [ -z "$RENDER_HOOK" ]; then
            echo "WARNING: RENDER_DEPLOY_HOOK_URL secret is not set in GitHub repository secrets."
            echo "Assuming external/auto deployment trigger."
          else
            echo "Triggering Render backend deployment hook..."
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$RENDER_HOOK")
            HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
            if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 201 ] && [ "$HTTP_STATUS" -ne 202 ]; then
              echo "ERROR: Deployment failed during [4/5] Deploying Backend (Hook HTTP ${HTTP_STATUS})."
              exit 1
            fi
            echo "Render backend deployment hook triggered successfully."
          fi

      - name: Wait for Backend Health
        env:
          BACKEND_URL: ${{ secrets.PRODUCTION_BACKEND_URL }}
        run: |
          echo "[5/5] Waiting for Backend health..."
          TARGET_URL="${BACKEND_URL:-https://mailsentry-backend.onrender.com}"
          HEALTH_URL="${TARGET_URL}/health"
          
          MAX_ATTEMPTS=40
          ATTEMPT=1
          SUCCESS=0

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            HTTP_STATUS=$(curl -s -o backend_health.json -w "%{http_code}" "${HEALTH_URL}" || echo "000")
            echo "Backend status: ${HTTP_STATUS}"

            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "Backend is healthy."
              echo "Deployment successful."
              SUCCESS=1
              break
            fi

            ATTEMPT=$((ATTEMPT + 1))
            sleep 5
          done

          if [ $SUCCESS -ne 1 ]; then
            echo "========================================"
            echo "ERROR: Deployment failed during [5/5] Waiting for Backend health."
            echo "========================================"
            exit 1
          fi

  # =========================================================================
  # POST-DEPLOYMENT STATUS SUMMARY REPORT
  # =========================================================================
  post-deploy-summary:
    name: Generate Deployment Status Report
    needs: [deploy-ml-service, deploy-backend]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Generate Deployment Step Summary
        run: |
          ML_STATUS="${{ needs.deploy-ml-service.result }}"
          BACKEND_STATUS="${{ needs.deploy-backend.result }}"

          echo "## 🚀 MailSentry Production Deployment Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service Component | Status | Deployment Trigger | Readiness Probe |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- | --- | --- |" >> $GITHUB_STEP_SUMMARY

          if [ "$ML_STATUS" = "success" ]; then
            echo "| **ML Microservice** | ✅ Success | Render Hook | `/health` = 200 OK |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| **ML Microservice** | ❌ Failed | Render Hook | Readiness Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$BACKEND_STATUS" = "success" ]; then
            echo "| **Backend API** | ✅ Success | Render Hook | `/health` = 200 OK |" >> $GITHUB_STEP_SUMMARY
          elif [ "$ML_STATUS" != "success" ]; then
            echo "| **Backend API** | 🚫 Skipped | Blocked by ML Failure | Not Executed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| **Backend API** | ❌ Failed | Render Hook | Health Check Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "| **Frontend Web App** | ✅ Deployed | Vercel Git Integration | Vercel Cloud |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit SHA:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered By:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          
          if [ "$ML_STATUS" = "success" ] && [ "$BACKEND_STATUS" = "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "========================================" >> $GITHUB_STEP_SUMMARY
            echo "MailSentry deployment successful" >> $GITHUB_STEP_SUMMARY
            echo "========================================" >> $GITHUB_STEP_SUMMARY
          fi
