# =========================================================================
# MailSentry Automated Continuous Integration (CI) Pipeline
# =========================================================================

name: MailSentry Continuous Integration (CI)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # JOB 1: FRONTEND CI (TYPES, LINT & BUILD VALIDATION)
  # =========================================================================
  frontend-ci:
    name: Frontend CI (Types & Production Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment (20.x)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 3. Install Dependencies
        run: |
          npm ci || npm install

      - name: 4. Type Check (tsc --noEmit)
        run: |
          npm run test || npx tsc --noEmit

      - name: 5. Build Production Bundle
        run: |
          npm run build

  # =========================================================================
  # JOB 2: BACKEND CI (QUALITY, TYPE CHECK & UNIT TESTS)
  # =========================================================================
  backend-ci:
    name: Backend CI (Quality, Type Check & Tests)
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
    defaults:
      run:
        working-directory: backend

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Python Environment (3.11)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 3. Setup Astral uv Package Manager
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-path: backend/requirements.txt

      - name: 4. Install Dependencies
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system ruff mypy pytest pytest-cov

      - name: 5. Code Linting (Ruff)
        run: |
          ruff check app tests || true

      - name: 6. Run Backend Pytest Suite
        env:
          MONGO_URI: mongodb://localhost:27017
          MONGODB_URI: mongodb://localhost:27017
          DATABASE_NAME: mailsentry_test_db
          DATA_BASE_NAME: mailsentry_test_db
          JWT_SECRET_KEY: testsecretkey12345678901234567890123
        run: |
          pytest tests

      - name: 7. FastAPI Startup & Health Check Verification
        env:
          MONGO_URI: mongodb://localhost:27017
          MONGODB_URI: mongodb://localhost:27017
          DATABASE_NAME: mailsentry_test_db
          DATA_BASE_NAME: mailsentry_test_db
          JWT_SECRET_KEY: testsecretkey12345678901234567890123
        run: |
          python main.py > server.log 2>&1 &
          SERVER_PID=$!
          HEALTH_STATUS="000"
          for i in {1..10}; do
            HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8000/health" || echo "000")
            if [ "$HEALTH_STATUS" -eq 200 ]; then
              break
            fi
            sleep 1
          done
          kill $SERVER_PID 2>/dev/null || true
          if [ "$HEALTH_STATUS" -ne 200 ]; then
            echo "FastAPI startup health probe failed (HTTP $HEALTH_STATUS)!"
            cat server.log
            exit 1
          fi
          echo "FastAPI startup health check PASSED (HTTP 200)."

  # =========================================================================
  # JOB 3: ML MICROSERVICE CI (PREPROCESSING, SCHEMAS, INFERENCE & ENDPOINTS)
  # =========================================================================
  ml-service-ci:
    name: ML Microservice CI (Artifacts, Engine & Endpoints)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Python Environment (3.11)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 3. Setup Astral uv Package Manager
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-path: |
            ml-service/requirements-base.txt
            ml-service/requirements.txt

      - name: 4. Install ML Microservice Dependencies
        env:
          CLASSIFICATION_MODEL: "mlops"
        run: |
          python install_deps.py --uv --cpu
          uv pip install --system ruff httpx

      - name: 5. Code Linting (Ruff)
        run: |
          ruff check app || true

      - name: 6. Run ML Microservice Test Suite
        run: |
          python -m unittest discover -s tests

      - name: 7. ML Microservice Startup & Endpoint Health Check
        run: |
          python main.py > ml_server.log 2>&1 &
          SERVER_PID=$!
          HEALTH_STATUS="000"
          VERSION_STATUS="000"
          for i in {1..10}; do
            HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:9000/health" || echo "000")
            VERSION_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:9000/version" || echo "000")
            if [ "$HEALTH_STATUS" -eq 200 ] && [ "$VERSION_STATUS" -eq 200 ]; then
              break
            fi
            sleep 1
          done
          kill $SERVER_PID 2>/dev/null || true
          if [ "$HEALTH_STATUS" -ne 200 ] || [ "$VERSION_STATUS" -ne 200 ]; then
            echo "ML Service startup endpoint probe failed (Health: $HEALTH_STATUS, Version: $VERSION_STATUS)!"
            cat ml_server.log
            exit 1
          fi
          echo "ML Microservice startup check PASSED (Health: HTTP 200, Version: HTTP 200)."

  # =========================================================================
  # JOB 4: CROSS-SERVICE INTEGRATION GATE (REPORTS STATUS FOR BRANCH PROTECTION)
  # =========================================================================
  cross-service-gate:
    name: Cross-Service Integration Gate
    needs: [frontend-ci, backend-ci, ml-service-ci]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Report Cross-Service Integration Status
        run: |
          FRONTEND_RESULT="${{ needs.frontend-ci.result }}"
          BACKEND_RESULT="${{ needs.backend-ci.result }}"
          ML_RESULT="${{ needs.ml-service-ci.result }}"

          echo "========================================================="
          echo "MailSentry Cross-Service Integration Gate Verification"
          echo "========================================================="
          echo "Frontend CI Status:        $FRONTEND_RESULT"
          echo "Backend CI Status:         $BACKEND_RESULT"
          echo "ML Microservice CI Status: $ML_RESULT"
          echo "========================================================="

          if [ "$FRONTEND_RESULT" = "success" ] && [ "$BACKEND_RESULT" = "success" ] && [ "$ML_RESULT" = "success" ]; then
            echo "✅ ALL MICROSERVICES PASSED CI INTEGRATION GATE SUCCESSFULLY!"
            exit 0
          else
            echo "❌ CROSS-SERVICE INTEGRATION GATE FAILED: One or more microservices failed CI validation."
            exit 1
          fi

