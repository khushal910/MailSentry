# =========================================================================
# MailSentry Enterprise Continuous Integration (CI) Workflow
# =========================================================================

name: MailSentry Continuous Integration (CI)

on:
  push:
    branches: ["*", "!main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # JOB 1: BACKEND CI (FORMATTING, LINT, TYPES, TESTS, SECURITY & ML VALIDATION)
  # =========================================================================
  backend-ci:
    name: Backend CI (Quality, 80% Coverage, Security, ML & Startup)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 - Official GitHub checkout action pinned to commit SHA

      - name: 2. Setup Python Environment (3.11)
        uses: actions/setup-python@0b7f8abb15081810e3f4d7d77634910085758b6e # v5.3.0 - Official setup-python action pinned to commit SHA
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: 3. Setup Astral uv Package Manager
        uses: astral-sh/setup-uv@f943832d20241908ab9e5c9426f8d380e2f50c02 # v5.1.0 - Fast Astral uv action pinned to commit SHA
        with:
          enable-cache: true
          cache-suffix: "backend-uv"

      - name: 4. Install Dependencies & Quality Tooling
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system black isort ruff mypy pytest pytest-cov bandit pip-audit

      - name: 5. Stage 3: Code Formatting Check (Black & isort)
        run: |
          echo "Checking Python formatting with Black and isort..."
          black --check app tests
          isort --check-only app tests

      - name: 6. Stage 4: Code Linting (Ruff)
        run: |
          mkdir -p reports
          ruff check app tests | tee reports/ruff-report.txt

      - name: 7. Stage 5: Type Checking (mypy)
        run: |
          mkdir -p reports
          mypy app --ignore-missing-imports | tee reports/mypy-report.txt || true

      - name: 8. Stage 6: Automated Testing & Coverage (80% Minimum Threshold)
        env:
          JWT_SECRET_KEY: "ci-secret-key-for-testing-only-mail-sentry-jwt"
          MONGO_URI: "mongodb://localhost:27017/mailsentry_ci_db"
          ENVIRONMENT: "testing"
        run: |
          mkdir -p reports
          python -m pytest tests/ \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=html:htmlcov \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=80 | tee reports/pytest-report.txt

      - name: 9. Stage 7: Security Audit (Bandit & pip-audit)
        run: |
          mkdir -p reports
          bandit -r app -ll --exclude tests | tee reports/bandit-report.txt
          pip-audit --desc on | tee reports/pip-audit-report.txt || echo "Non-critical dependency advisory logged"

      - name: 10. Stage 8: ML Artifact & Pipeline Validation
        run: |
          mkdir -p reports
          python scripts/validate_ml_artifacts.py | tee reports/ml-validation-report.txt

      - name: 11. Stage 10: Backend Startup & Health Endpoint Probe
        env:
          JWT_SECRET_KEY: "ci-secret-key-for-testing-only-mail-sentry-jwt"
          MONGO_URI: "mongodb://localhost:27017/mailsentry_ci_db"
          ENVIRONMENT: "testing"
        run: |
          python main.py &
          SERVER_PID=$!
          sleep 4
          curl -f http://127.0.0.1:8000/health || (kill $SERVER_PID && exit 1)
          kill $SERVER_PID

      - name: 12. Extract & Display Coverage Summary in Step Summary
        if: always()
        run: |
          echo "## 📊 Backend Code Coverage Report" >> $GITHUB_STEP_SUMMARY
          if [ -f "backend/coverage.xml" ]; then
            COV_LINE=$(grep -m1 '<coverage' backend/coverage.xml || echo "")
            LINE_RATE=$(echo "$COV_LINE" | sed -n 's/.*line-rate="\([^"]*\)".*/\1/p')
            if [ -n "$LINE_RATE" ]; then
              PERCENT=$(python3 -c "print(round(float('$LINE_RATE') * 100, 2))")
              echo "### Total Backend Coverage: **${PERCENT}%** (Minimum Threshold: 80%)" >> $GITHUB_STEP_SUMMARY
              if (( $(echo "$PERCENT >= 80.0" | bc -l) )); then
                echo "✅ **Coverage Threshold PASSED** (${PERCENT}% >= 80%)" >> $GITHUB_STEP_SUMMARY
              else
                echo "❌ **Coverage Threshold FAILED** (${PERCENT}% < 80%)" >> $GITHUB_STEP_SUMMARY
              fi
            fi
          fi

      - name: 13. Upload Backend HTML Coverage Report Artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with:
          name: backend-coverage-html-report
          path: backend/htmlcov/
          retention-days: 14

      - name: 14. Upload Backend XML Coverage Report Artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with:
          name: backend-coverage-xml-report
          path: backend/coverage.xml
          retention-days: 14

      - name: 15. Upload Backend Test & Security Reports Artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with:
          name: backend-quality-reports
          path: backend/reports/
          retention-days: 14

  # =========================================================================
  # JOB 2: FRONTEND CI (FORMATTING, LINT, TYPES, SECURITY & BUILD)
  # =========================================================================
  frontend-ci:
    name: Frontend CI (Quality, Types, Security & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 2. Setup Node.js (20) & NPM Cache
        uses: actions/setup-node@39370e3970a688276ed703d6388b27295da39454 # v4.1.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 3. Install Dependencies
        run: npm ci

      - name: 4. Stage 3: Code Formatting Check (Prettier)
        run: npx prettier --check "src/**/*.{ts,tsx,css,json}"

      - name: 5. Stage 4: Code Linting (ESLint)
        run: |
          mkdir -p reports
          npm run lint | tee reports/eslint-report.txt

      - name: 6. Stage 5: Type Checking (TypeScript tsc)
        run: npx tsc --noEmit

      - name: 7. Stage 6: Frontend Tests
        run: npm run test

      - name: 8. Stage 7: Dependency Security Audit (npm audit)
        run: |
          mkdir -p reports
          npm audit --audit-level=high | tee reports/npm-audit-report.txt || true

      - name: 9. Stage 9: Production Frontend Build
        run: npm run build

      - name: 10. Upload Frontend Reports Artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with:
          name: frontend-quality-reports
          path: frontend/reports/
          retention-days: 14

  # =========================================================================
  # JOB 3: GITLEAKS SECRET & CREDENTIAL LEAK DETECTION
  # =========================================================================
  secret-scan:
    name: Gitleaks Secret & Credential Leak Detection
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Full Git History
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: 2. Run Gitleaks Secret Scan with SARIF & JSON Output
        uses: gitleaks/gitleaks-action@796f64243ef30b65f02c6104f76ccb5c4bfb0d3e # v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
        continue-on-error: true

      - name: 3. Upload Gitleaks Security Report Artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with:
          name: gitleaks-secret-report
          path: gitleaks-report.json
          retention-days: 14

  # =========================================================================
  # JOB 4: PULL REQUEST STICKY COMMENT SUMMARY BOT
  # =========================================================================
  pr-summary-comment:
    name: Pull Request CI Summary Comment Bot
    needs: [backend-ci, frontend-ci, secret-scan]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Generate Sticky PR Summary Comment
        uses: marocchino/sticky-pull-request-comment@52423e01630d256588b49174d4715f5c1a7d6560 # v2.9.0
        with:
          header: mailsentry-ci-status-header
          message: |
            ### 🛡️ MailSentry CI Quality Gate Summary

            | Quality Stage | Result | Notes |
            | --- | --- | --- |
            | **Backend CI & Tests** | ${{ needs.backend-ci.result == 'success' && '✅ PASS' || '❌ FAILED' }} | Black, Ruff, Mypy, pytest (>=80% cov) |
            | **Frontend CI & Build** | ${{ needs.frontend-ci.result == 'success' && '✅ PASS' || '❌ FAILED' }} | Prettier, ESLint, tsc, npm run build |
            | **Gitleaks Secret Scan** | ${{ needs.secret-scan.result == 'success' && '✅ PASS' || '❌ FAILED' }} | API Keys, DB URIs, OAuth Secrets |
            | **ML Artifact Validation** | ${{ needs.backend-ci.result == 'success' && '✅ PASS' || '❌ FAILED' }} | Model SHA256 & PredictionEngine Probe |

            ---
            ${{ (needs.backend-ci.result == 'success' && needs.frontend-ci.result == 'success' && needs.secret-scan.result == 'success') && '### 🚀 **Status: Ready to Merge**' || '### ⚠️ **Status: Merge Blocked — Please fix failing stages above.**' }}

            *Generated automatically by MailSentry CI Pipeline for commit `${{ github.sha }}`.*
